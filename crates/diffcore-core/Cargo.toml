[package]
name = "diffcore-core"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
petgraph = "0.6"
git2 = { version = "0.20", features = ["vendored-openssl"] }
thiserror = "2"
tree-sitter = "0.26.7"
# --- Core 13 languages (always-on; required by entrypoint.rs / flow.rs / ast.rs) ---
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-rust = "0.24.1"
tree-sitter-java = "0.23.5"
tree-sitter-c-sharp = "0.23.1"
tree-sitter-php = "0.24.2"
tree-sitter-ruby = "0.23.1"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-swift = "0.7.1"
tree-sitter-c = "0.24.1"
tree-sitter-cpp = "0.23.4"
tree-sitter-scala = "0.25.0"

# --- Extra languages (each gated behind `lang-<name>`; default-on via `extra-languages`) ---
tree-sitter-bash = { version = "0.25.1", optional = true }
tree-sitter-haskell = { version = "0.23.1", optional = true }
tree-sitter-nix = { version = "0.3.0", optional = true }
tree-sitter-lua = { version = "0.5.0", optional = true }
tree-sitter-perl-next = { version = "0.1.0", optional = true }
tree-sitter-elixir = { version = "0.3.5", optional = true }
tree-sitter-erlang = { version = "0.15.0", optional = true }
tree-sitter-zig = { version = "1.1.2", optional = true }
tree-sitter-ocaml = { version = "0.24.2", optional = true }
tree-sitter-julia = { version = "0.23.1", optional = true }
tree-sitter-dart-orchard = { version = "0.3.2", optional = true }
tree-sitter-r = { version = "1.2.0", optional = true }
tree-sitter-fish = { version = "3.6.0", optional = true }
tree-sitter-html = { version = "0.23.2", optional = true }
tree-sitter-css = { version = "0.25.0", optional = true }
tree-sitter-scss = { version = "1.0.0", optional = true }
tree-sitter-json = { version = "0.24.8", optional = true }
tree-sitter-yaml = { version = "0.7.2", optional = true }
tree-sitter-toml-ng = { version = "0.7.0", optional = true }
tree-sitter-md = { version = "0.5.3", optional = true }
tree-sitter-graphql = { version = "0.1.0", optional = true }
tree-sitter-vue-next = { version = "0.1.0", optional = true }
tree-sitter-svelte-next = { version = "0.1.1", optional = true }
toml = "0.8"
glob = "0.3"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
schemars = "0.8"
aho-corasick = "1"
rayon = "1.10"
bincode = "1"
dashmap = "6"
once_cell = "1"
log = { workspace = true }
tempfile = "3"
fastembed = { version = "4", optional = true }

[features]
default = ["extra-languages"]

## Enable every extra (post-core-13) language at once.
extra-languages = [
    "lang-bash",
    "lang-haskell",
    "lang-nix",
    "lang-lua",
    "lang-perl",
    "lang-elixir",
    "lang-erlang",
    "lang-zig",
    "lang-ocaml",
    "lang-julia",
    "lang-dart",
    "lang-r",
    "lang-fish",
    "lang-html",
    "lang-css",
    "lang-scss",
    "lang-json",
    "lang-yaml",
    "lang-toml",
    "lang-markdown",
    "lang-graphql",
    "lang-vue",
    "lang-svelte",
]

# Per-language feature flags (Phase 1: extras only — core 13 are always on).
lang-bash     = ["dep:tree-sitter-bash"]
lang-haskell  = ["dep:tree-sitter-haskell"]
lang-nix      = ["dep:tree-sitter-nix"]
lang-lua      = ["dep:tree-sitter-lua"]
lang-perl     = ["dep:tree-sitter-perl-next"]
lang-elixir   = ["dep:tree-sitter-elixir"]
lang-erlang   = ["dep:tree-sitter-erlang"]
lang-zig      = ["dep:tree-sitter-zig"]
lang-ocaml    = ["dep:tree-sitter-ocaml"]
lang-julia    = ["dep:tree-sitter-julia"]
lang-dart     = ["dep:tree-sitter-dart-orchard"]
lang-r        = ["dep:tree-sitter-r"]
lang-fish     = ["dep:tree-sitter-fish"]
lang-html     = ["dep:tree-sitter-html"]
lang-css      = ["dep:tree-sitter-css"]
lang-scss     = ["dep:tree-sitter-scss"]
lang-json     = ["dep:tree-sitter-json"]
lang-yaml     = ["dep:tree-sitter-yaml"]
lang-toml     = ["dep:tree-sitter-toml-ng"]
lang-markdown = ["dep:tree-sitter-md"]
lang-graphql  = ["dep:tree-sitter-graphql"]
lang-vue      = ["dep:tree-sitter-vue-next"]
lang-svelte   = ["dep:tree-sitter-svelte-next"]

## Enables test-only APIs like `with_base_url` on LLM provider structs.
## Integration tests should enable this feature; production builds must not.
test-support = []
## Enables local code embeddings via fastembed (ONNX Runtime + Jina Code model).
## Used for semantic similarity between file diffs in clustering.
embeddings = ["dep:fastembed"]

# Enable test-support feature automatically when running tests
# (dev-dependencies trigger `cfg(test)` in unit tests but not integration tests,
# so we also enable the feature here for integration test access to `with_base_url`).
[dev-dependencies]
diffcore-core = { path = ".", features = ["test-support"] }
proptest = "1"
tokio = { version = "1", features = ["full", "test-util"] }
wiremock = "0.6"
dotenv = "0.15"
criterion = { version = "0.5", features = ["html_reports"] }
insta = { version = "1", features = ["json", "redactions"] }

[[bench]]
name = "parse_benchmark"
harness = false
